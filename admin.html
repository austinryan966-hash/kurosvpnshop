<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Orders</title><link rel="icon" href="assets/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="adm">
  <form id="login" class="card">
    <h3>Admin login</h3><br>
    <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <p id="msg" class="err" role="alert"></p>
    <button class="btn" type="submit">Log in</button>
  </form>
  <div id="panel" hidden>
    <div class="foot"><h2><span data-brand></span> orders</h2>
      <div class="row"><button class="btn ghost sm" id="refresh">Refresh</button><button class="btn ghost sm" id="logout">Log out</button></div></div><br>
    <div class="tabs fbar">
      <button class="tab flt on" data-f="all">All <i>0</i></button>
      <button class="tab flt" data-f="new">New <i>0</i></button>
      <button class="tab flt" data-f="paid">Paid <i>0</i></button>
      <button class="tab flt" data-f="delivered">Delivered <i>0</i></button>
      <button class="tab flt" data-f="rejected">Rejected <i>0</i></button>
    </div>
    <div id="list" class="grid g3"></div>
  </div>
</div>
<script src="config.js"></script>
<script src="admin.js"></script>
</body></html>
